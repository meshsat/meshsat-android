# =============================================================================
# MeshSat Android CI/CD Pipeline
# =============================================================================
# - Push to main: build debug APK (verify)
# - Tag push (v*): build signed release APK + AAB → upload to GitLab Package
#                  Registry → create GitLab Release → create GitHub Release
#
# Two editions since 2.19.0 (MESHSAT-1335): the fdroid flavor is the full app and is what the
# APKs, GitHub and F-Droid carry; the play flavor is the Google Play edition without SMS and
# leaves here only as an AAB. Gradle task names carry the flavor (assembleFdroidRelease,
# testFdroidDebugUnitTest); the fdroid APK file names are unchanged, which F-Droid's recipe
# and its byte-for-byte comparison depend on.
# =============================================================================

stages:
  - validate
  - test
  - build
  - release

variables:
  GITHUB_REPO: "meshsat/meshsat-android"
  BAO_ADDR: "https://openbao.nuclearlighters.net:8200"

# =============================================================================
# Changelog files must exist for every APK of this version (MESHSAT-1260)
# A release ships five APKs with versionCodes base*10+0..4, and F-Droid reads its
# "What's new" per versionCode. A missing file is invisible until it shows as an
# empty changelog in the client, so fail here instead. scripts/bump-version.sh
# writes all five.
# =============================================================================
changelog-files:
  stage: validate
  image: python:3.12-slim
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v/'
  script:
    - |
      python3 - <<'PYEOF'
      import re, sys, pathlib
      gradle = pathlib.Path("app/build.gradle.kts").read_text()
      m = re.search(r'^\s*versionCode\s*=\s*(\d+)', gradle, re.M)
      n = re.search(r'^\s*versionName\s*=\s*"([^"]+)"', gradle, re.M)
      if not m or not n:
          sys.exit("versionCode/versionName must be literal in app/build.gradle.kts "
                   "(F-Droid's checkupdates reads them with a number-only regex)")
      base, name = int(m.group(1)), n.group(1)
      d = pathlib.Path("fastlane/metadata/android/en-US/changelogs")
      abis = ["universal", "armeabi-v7a", "arm64-v8a", "x86", "x86_64"]
      missing = []
      for digit, abi in enumerate(abis):
          f = d / f"{base * 10 + digit}.txt"
          if not f.is_file() or not f.read_text().strip():
              missing.append(f"{f.name} ({abi})")
      if missing:
          print(f"v{name} (versionCode base {base}) is missing changelog files:")
          for x in missing:
              print("  -", x)
          sys.exit("run scripts/bump-version.sh, or write the files by hand")
      print(f"v{name}: all five changelog files present for {base * 10}-{base * 10 + 4}")
      PYEOF

# =============================================================================
# Unit tests (every push to main and every tag) — MESHSAT-1259
# Runs before the build stage, so a red test stops a release rather than
# following it. 609 tests, JVM only, no device needed.
# =============================================================================
test:
  stage: test
  image: cimg/android:2024.10.1
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v/'
  # Both flavors: the play run is what proves the play manifest, BuildConfig, Room and protobuf
  # generation before a tag build, and SmsEditionTest checks the SMS gate under each.
  # One worker: the two Kotlin compiles side by side ran the compiler daemon out of heap
  # ("GC overhead limit exceeded") on the 8 GB SDK VM.
  script:
    - bash ./gradlew --max-workers=1 testFdroidDebugUnitTest testPlayDebugUnitTest
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit:
        - app/build/test-results/testFdroidDebugUnitTest/TEST-*.xml
        - app/build/test-results/testPlayDebugUnitTest/TEST-*.xml
    paths:
      - app/build/reports/tests/testFdroidDebugUnitTest
      - app/build/reports/tests/testPlayDebugUnitTest

# =============================================================================
# Build debug APK (every push to main — verification only)
# =============================================================================
build-debug:
  stage: build
  image: cimg/android:2024.10.1
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - bash ./gradlew assembleFdroidDebug
    - |
      APK_PATH=$(find app/build/outputs/apk/fdroid/debug -name "*.apk" | head -1)
      VERSION="dev-${CI_COMMIT_SHORT_SHA}"
      APK_NAME="meshsat-android-${VERSION}-debug.apk"
      cp "$APK_PATH" "$APK_NAME"
      echo "Built: ${APK_NAME} ($(du -h ${APK_NAME} | cut -f1))"
  artifacts:
    paths:
      - "meshsat-android-*-debug.apk"
    expire_in: 7 days

# =============================================================================
# Build signed release APK + AAB (tag push only)
# Authenticates to OpenBao via GitLab JWT, fetches signing secrets, builds
# signed release artifacts for Play Store (AAB) and sideload (APK).
# =============================================================================
build-release:
  stage: build
  image: cimg/android:2024.10.1
  id_tokens:
    BAO_ID_TOKEN:
      aud: https://gitlab.nuclearlighters.net
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  script:
    - |
      set -euo pipefail
      VERSION="${CI_COMMIT_TAG#v}"

      # ── Install CA certificate for OpenBao TLS ──
      if [ -n "${BAO_CA_CERT:-}" ]; then
        sudo mkdir -p /usr/local/share/ca-certificates
        echo "$BAO_CA_CERT" | sudo tee /usr/local/share/ca-certificates/openbao-ca.crt > /dev/null
        sudo update-ca-certificates
      fi

      # ── Authenticate to OpenBao via JWT ──
      echo "Authenticating to OpenBao..."
      BAO_RESPONSE=$(curl -sf \
        --request POST \
        --data "{\"role\": \"gitlab-ci\", \"jwt\": \"${BAO_ID_TOKEN}\"}" \
        "${BAO_ADDR}/v1/auth/jwt/login")
      BAO_TOKEN=$(echo "$BAO_RESPONSE" | jq -r '.auth.client_token')
      if [ -z "$BAO_TOKEN" ] || [ "$BAO_TOKEN" = "null" ]; then
        echo "ERROR: OpenBao JWT authentication failed."
        exit 1
      fi
      echo "  Authenticated."

      # ── Fetch signing secrets ──
      echo "Fetching signing secrets..."
      SECRETS=$(curl -sf \
        --header "X-Vault-Token: ${BAO_TOKEN}" \
        "${BAO_ADDR}/v1/secret/data/ci/android-signing")
      KEYSTORE_B64=$(echo "$SECRETS" | jq -r '.data.data.keystore_b64')
      export ANDROID_STORE_PASSWORD=$(echo "$SECRETS" | jq -r '.data.data.store_password')
      export ANDROID_KEY_PASSWORD=$(echo "$SECRETS" | jq -r '.data.data.key_password')
      export ANDROID_KEY_ALIAS=$(echo "$SECRETS" | jq -r '.data.data.key_alias')
      if [ -z "$KEYSTORE_B64" ] || [ "$KEYSTORE_B64" = "null" ]; then
        echo "ERROR: Failed to fetch keystore from OpenBao."
        exit 1
      fi
      echo "  Secrets fetched."

      # ── Decode keystore to temp file ──
      echo "$KEYSTORE_B64" | base64 -d > /tmp/meshsat-upload.p12
      export ANDROID_KEYSTORE_FILE="/tmp/meshsat-upload.p12"

      # ── Build the signed fdroid APKs and the play AAB ──
      # The full app as APKs (GitHub, F-Droid, the phone); the Google Play edition only as the
      # AAB Play wants, signed with the upload key and re-signed by Play (MESHSAT-1335).
      echo "Building signed release APKs (fdroid) + AAB (play)..."
      bash ./gradlew assembleFdroidRelease bundlePlayRelease

      # ── Collect artifacts ──
      # One APK per processor type plus a universal one; gradle already names each file
      # meshsat-android-<version>-<abi>-<versionCode>.apk (MESHSAT-1260).
      cp app/build/outputs/apk/fdroid/release/meshsat-android-*.apk .
      AAB_PATH=$(find app/build/outputs/bundle/playRelease -name "*.aab" | head -1)
      AAB_NAME="meshsat-android-${VERSION}-play.aab"
      cp "$AAB_PATH" "$AAB_NAME"

      # The version sits between the prefix and the ABI, so a file of another edition
      # (meshsat-android-<version>-play-<abi>-<code>.apk) can never match.
      APK_UNIVERSAL=$(ls meshsat-android-${VERSION}-universal-*.apk)
      APK_ARM64=$(ls meshsat-android-${VERSION}-arm64-v8a-*.apk)
      APK_ARM32=$(ls meshsat-android-${VERSION}-armeabi-v7a-*.apk)
      APK_X86=$(ls meshsat-android-${VERSION}-x86-*.apk)
      APK_X86_64=$(ls meshsat-android-${VERSION}-x86_64-*.apk)
      APK_NAMES="$APK_UNIVERSAL $APK_ARM64 $APK_ARM32 $APK_X86 $APK_X86_64"

      {
        echo "APK_NAMES=${APK_NAMES}"
        echo "APK_UNIVERSAL=${APK_UNIVERSAL}"
        echo "APK_ARM64=${APK_ARM64}"
        echo "APK_ARM32=${APK_ARM32}"
        echo "APK_X86=${APK_X86}"
        echo "APK_X86_64=${APK_X86_64}"
        echo "AAB_NAME=${AAB_NAME}"
        echo "VERSION=${VERSION}"
      } >> build.env

      for F in $APK_NAMES "$AAB_NAME"; do
        echo "Built: ${F} ($(du -h ${F} | cut -f1))"
      done

      # ── Clean up keystore ──
      rm -f /tmp/meshsat-upload.p12

      # ── Revoke OpenBao token ──
      curl -sf \
        --header "X-Vault-Token: ${BAO_TOKEN}" \
        --request POST \
        "${BAO_ADDR}/v1/auth/token/revoke-self" || true
  artifacts:
    paths:
      - "meshsat-android-*.apk"
      - "meshsat-android-*-play.aab"
    reports:
      dotenv: build.env
    expire_in: 7 days

# =============================================================================
# Upload APK + AAB to GitLab Package Registry (tag push only)
# =============================================================================
upload-package:
  stage: release
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  needs:
    - job: build-release
      artifacts: true
  script:
    - apk add --no-cache curl
    - |
      set -e
      for FILE in $APK_NAMES "$AAB_NAME"; do
        echo "Uploading ${FILE} to GitLab Package Registry..."
        curl --fail \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "${FILE}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/meshsat-android/${VERSION}/${FILE}"
        echo "  Uploaded ${FILE}."
      done

# =============================================================================
# Upload the Play edition to the Play Console (tag push only, MESHSAT-1341)
# =============================================================================
# The service account key lives in OpenBao at secret/ci/android-play (field
# service_account_json), fetched with the same JWT role as the signing keystore. Until that
# secret exists the job says so and passes, so a tag pipeline is never red for it. The account
# may only release to testing tracks, so PLAY_TRACK is alpha (reviewed) or internal (not).
publish-play:
  stage: release
  image: python:3.12-slim
  id_tokens:
    BAO_ID_TOKEN:
      aud: https://gitlab.nuclearlighters.net
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  needs:
    - job: build-release
      artifacts: true
  allow_failure: true
  variables:
    PLAY_TRACK: "alpha"
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl jq ca-certificates > /dev/null
    - |
      set -euo pipefail
      if [ -n "${BAO_CA_CERT:-}" ]; then
        echo "$BAO_CA_CERT" > /usr/local/share/ca-certificates/openbao-ca.crt
        update-ca-certificates > /dev/null
      fi
      BAO_TOKEN=$(curl -sf --request POST \
        --data "{\"role\": \"gitlab-ci\", \"jwt\": \"${BAO_ID_TOKEN}\"}" \
        "${BAO_ADDR}/v1/auth/jwt/login" | jq -r '.auth.client_token')
      [ -n "$BAO_TOKEN" ] && [ "$BAO_TOKEN" != "null" ] || { echo "ERROR: OpenBao JWT login failed"; exit 1; }
      CODE=$(curl -s -o /tmp/play.json -w '%{http_code}' --header "X-Vault-Token: ${BAO_TOKEN}" \
        "${BAO_ADDR}/v1/secret/data/ci/android-play")
      if [ "$CODE" = "404" ]; then
        echo "No Play credentials in OpenBao yet (secret/ci/android-play): nothing uploaded."
        curl -sf --header "X-Vault-Token: ${BAO_TOKEN}" --request POST "${BAO_ADDR}/v1/auth/token/revoke-self" || true
        exit 0
      fi
      [ "$CODE" = "200" ] || { echo "ERROR: OpenBao answered $CODE for secret/ci/android-play"; exit 1; }
      jq -r '.data.data.service_account_json' /tmp/play.json > /tmp/play-sa.json
      curl -sf --header "X-Vault-Token: ${BAO_TOKEN}" --request POST "${BAO_ADDR}/v1/auth/token/revoke-self" || true
      pip install -q google-auth requests
      python3 scripts/publish-play.py --aab "${AAB_NAME}" --track "${PLAY_TRACK}" \
        --version-name "${VERSION}" --service-account /tmp/play-sa.json
      rm -f /tmp/play-sa.json /tmp/play.json

# =============================================================================
# Create GitLab Release (tag push only)
# =============================================================================
create-gitlab-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  needs:
    - job: build-release
      artifacts: true
    - job: upload-package
  script:
    - echo "Creating GitLab release for ${CI_COMMIT_TAG}"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "MeshSat Android ${CI_COMMIT_TAG}"
    description: |
      MeshSat Android ${CI_COMMIT_TAG}

      ## Download

      Pick the APK for your phone's processor; nearly every phone since 2016 is arm64-v8a.
      The universal APK works on all of them and is bigger. The APKs are the full app, SMS
      included. The AAB is the Google Play edition, which has no SMS: it is for Play, not
      for sideloading.

      - [${APK_ARM64}](${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/meshsat-android/${VERSION}/${APK_ARM64}) — arm64-v8a, the usual choice
      - [${APK_ARM32}](${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/meshsat-android/${VERSION}/${APK_ARM32}) — armeabi-v7a, older 32-bit phones
      - [${APK_X86}](${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/meshsat-android/${VERSION}/${APK_X86}) — x86, emulators
      - [${APK_X86_64}](${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/meshsat-android/${VERSION}/${APK_X86_64}) — x86_64, emulators
      - [${APK_UNIVERSAL}](${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/meshsat-android/${VERSION}/${APK_UNIVERSAL}) — every processor in one file
      - [${AAB_NAME}](${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/meshsat-android/${VERSION}/${AAB_NAME}) — Google Play edition (no SMS), upload-key signed AAB
    assets:
      links:
        - name: "${APK_ARM64}"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/meshsat-android/${VERSION}/${APK_ARM64}"
          link_type: "package"
        - name: "${APK_ARM32}"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/meshsat-android/${VERSION}/${APK_ARM32}"
          link_type: "package"
        - name: "${APK_X86}"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/meshsat-android/${VERSION}/${APK_X86}"
          link_type: "package"
        - name: "${APK_X86_64}"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/meshsat-android/${VERSION}/${APK_X86_64}"
          link_type: "package"
        - name: "${APK_UNIVERSAL}"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/meshsat-android/${VERSION}/${APK_UNIVERSAL}"
          link_type: "package"
        - name: "${AAB_NAME}"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/meshsat-android/${VERSION}/${AAB_NAME}"
          link_type: "package"

# =============================================================================
# Deploy to the owner's phone (manual, tag pipelines only)
# =============================================================================
# The runner cannot reach the phone itself: adb needs a key the phone has
# authorised, and that prompt cannot be answered headlessly. The Android SDK VM
# already holds an authorised adb key and a standing connection, so the deploy
# goes through it. Manual and allow_failure, so a phone that is off or on another
# network never blocks a release.
#
# PHONE_ADB_TARGET is a CI variable because Android picks a new wireless-debugging
# port whenever it is toggled; the job falls back to whatever adb already sees.
deploy-to-phone:
  stage: release
  image: alpine:latest
  # Every release lands on the phone by itself, so what gets tested is what was built. A phone
  # that is off, asleep with wireless debugging down, or on another network is not a failure:
  # the job says so and ends green. Only a broken build or a broken CI setup is an error.
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
      allow_failure: true
  needs:
    - job: build-release
      artifacts: true
  variables:
    DEPLOY_SSH_HOST: "nllei01androidsdk01"
    DEPLOY_SSH_USER: "ansible"
    # A hint only: wireless debugging takes a new port on every reconnect, so the script asks
    # mDNS for the current one when this is stale.
    PHONE_ADB_TARGET: "192.168.181.230:39585"
  script:
    - apk add --no-cache openssh-client
    - |
      set -e
      if [ -z "${CI_DEPLOY_SSH_KEY:-}" ]; then
        echo "CI_DEPLOY_SSH_KEY is not set. It is a protected variable, so the tag must be protected (v* is)."
        exit 1
      fi
      mkdir -p ~/.ssh && chmod 700 ~/.ssh
      printf '%s\n' "$CI_DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
      chmod 600 ~/.ssh/id_ed25519
      ssh-keyscan -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      APK=$(ls meshsat-android-${VERSION}-arm64-v8a-*.apk | head -1)
      if [ -z "$APK" ]; then echo "no arm64-v8a APK in the build artifacts"; exit 1; fi
      echo "Deploying ${APK} through ${DEPLOY_SSH_HOST}"
      if ! scp -q -o IdentitiesOnly=yes -o ConnectTimeout=20 "$APK" "${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}:/tmp/${APK}"; then
        echo "The build VM ${DEPLOY_SSH_HOST} is not reachable. Nothing installed;"
        echo "the release itself is fine."
        exit 0
      fi

      cat > /tmp/remote.sh <<REMOTE
      set -e
      ADB=/opt/android-sdk/platform-tools/adb
      \$ADB connect "${PHONE_ADB_TARGET}" >/dev/null 2>&1 || true
      T=\$(\$ADB devices | awk '/device\$/ && \$1 != "List" {print \$1; exit}')
      if [ -z "\$T" ]; then
        # Wireless debugging takes a new port every time it reconnects, so the fixed
        # target above goes stale by itself. mDNS is how the phone announces the current
        # one (MESHSAT-1270 session, 20 Sep 2026: the port moved twice in an afternoon).
        M=\$(\$ADB mdns services 2>/dev/null | awk '/_adb-tls-connect/ {print \$3; exit}')
        if [ -n "\$M" ]; then \$ADB connect "\$M" >/dev/null 2>&1 || true; fi
        T=\$(\$ADB devices | awk '/device\$/ && \$1 != "List" {print \$1; exit}')
      fi
      if [ -z "\$T" ]; then
        echo "No phone: it is off, asleep with wireless debugging down, or on another network."
        echo "Nothing installed. The release itself is fine."
        exit 0
      fi
      echo "Installing on \$T"
      \$ADB -s "\$T" install -r "/tmp/${APK}"
      # An update kills the app, and nothing brings it back: the phone is a gateway, and it
      # stayed down after the v2.17.1 install until someone opened it by hand. Starting the
      # activity starts the foreground service with it.
      # Every adb shell here reads from /dev/null. This script is piped into "bash -s", and
      # adb shell inherits stdin: without the redirect the first one swallows the rest of the
      # script, which is exactly what happened on v2.18.2 - the install ran, everything after
      # it vanished, and the job still reported success.
      \$ADB -s "\$T" shell am start -n net.meshsat.android/.MainActivity </dev/null >/dev/null 2>&1 || true
      sleep 25
      \$ADB -s "\$T" shell dumpsys package net.meshsat.android </dev/null | grep -E "versionName|versionCode=" | head -2
      if \$ADB -s "\$T" shell dumpsys activity services net.meshsat.android </dev/null 2>/dev/null | grep -q ServiceRecord; then
        echo "Gateway service is running again."
      else
        echo "WARNING: the app is installed but its gateway service did not come back."
      fi
      rm -f "/tmp/${APK}"
      REMOTE
      ssh -o IdentitiesOnly=yes "${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}" 'bash -s' < /tmp/remote.sh

# =============================================================================
# Create GitHub Release with APK + AAB assets (tag push only)
# =============================================================================
create-github-release:
  stage: release
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  needs:
    - job: build-release
      artifacts: true
  script:
    - apk add --no-cache curl jq
    - |
      set -e

      if [ -z "${GHCR_TOKEN:-}" ]; then
        echo "WARN: GHCR_TOKEN not set — skipping GitHub release."
        exit 0
      fi

      echo "============================================================"
      echo "  Create GitHub Release for ${CI_COMMIT_TAG}"
      echo "============================================================"

      RELEASE_BODY="## MeshSat Android ${CI_COMMIT_TAG}

      Android companion app for MeshSat — Meshtastic + Satellite gateway.

      ### Download

      Pick the APK for your phone's processor. Nearly every phone since 2016 is **arm64-v8a**.
      The **universal** APK runs on all of them and is about 20 MB larger. The APKs are the
      full app, SMS included, the same build F-Droid ships.
      The AAB is the Google Play edition, which has no SMS (Play's policy for an app that is
      not the phone's SMS app); it is signed with the upload key and is not for sideloading.

      ### What it does
      - Meshtastic mesh over Bluetooth LE
      - Iridium satellite through a MeshSat node's RockBLOCK 9603
      - SMS through the phone's own SIM, optionally encrypted
      - APRS through a KISS TNC or APRS-IS
      - Reticulum transport node relaying between the links
      - Hub reporting over MQTT with a client certificate
      - SOS on every route at once, with a check-in timer and zones
      - Offline map and offline satellite pass prediction"

      # Check if release already exists (tag may arrive via mirror before this job)
      EXISTING=$(curl -s \
        -H "Authorization: token ${GHCR_TOKEN}" \
        -H "Accept: application/vnd.github+json" \
        "https://api.github.com/repos/${GITHUB_REPO}/releases/tags/${CI_COMMIT_TAG}")

      EXISTING_ID=$(echo "$EXISTING" | jq -r '.id // empty')

      if [ -n "$EXISTING_ID" ] && [ "$EXISTING_ID" != "null" ]; then
        echo "Updating existing release (ID: ${EXISTING_ID})..."
        curl -s -X PATCH \
          -H "Authorization: token ${GHCR_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${GITHUB_REPO}/releases/${EXISTING_ID}" \
          -d "$(jq -n \
            --arg name "MeshSat Android ${CI_COMMIT_TAG}" \
            --arg body "${RELEASE_BODY}" \
            '{name: $name, body: $body, prerelease: false}'
          )" > /dev/null
        RELEASE_ID="$EXISTING_ID"
        UPLOAD_URL="https://uploads.github.com/repos/${GITHUB_REPO}/releases/${RELEASE_ID}/assets"

        # Delete existing assets if present (re-upload fresh)
        ASSETS=$(curl -s \
          -H "Authorization: token ${GHCR_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${GITHUB_REPO}/releases/${RELEASE_ID}/assets")
        for ASSET_NAME in $APK_NAMES "$AAB_NAME"; do
          OLD_ID=$(echo "$ASSETS" | jq -r ".[] | select(.name == \"${ASSET_NAME}\") | .id // empty")
          if [ -n "$OLD_ID" ]; then
            echo "  Deleting old asset: ${ASSET_NAME}..."
            curl -s -X DELETE \
              -H "Authorization: token ${GHCR_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPO}/releases/assets/${OLD_ID}" > /dev/null
          fi
        done
        echo "  Release updated."
      else
        echo "Creating new release..."
        RESP=$(curl -s -X POST \
          -H "Authorization: token ${GHCR_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${GITHUB_REPO}/releases" \
          -d "$(jq -n \
            --arg tag "${CI_COMMIT_TAG}" \
            --arg name "MeshSat Android ${CI_COMMIT_TAG}" \
            --arg body "${RELEASE_BODY}" \
            '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false}'
          )")
        RELEASE_ID=$(echo "$RESP" | jq -r '.id')
        UPLOAD_URL="https://uploads.github.com/repos/${GITHUB_REPO}/releases/${RELEASE_ID}/assets"
        echo "  Release created (ID: ${RELEASE_ID})."
      fi

      # Upload every APK as a release asset (one per processor type, plus universal)
      for APK in $APK_NAMES; do
      echo "Uploading ${APK} ($(du -h ${APK} | cut -f1))..."
      UPLOAD_RESP=$(curl -s -w "\n%{http_code}" \
        --max-time 600 \
        -X POST \
        -H "Authorization: token ${GHCR_TOKEN}" \
        -H "Content-Type: application/vnd.android.package-archive" \
        "${UPLOAD_URL}?name=${APK}" \
        --data-binary "@${APK}")

      HTTP_CODE=$(echo "$UPLOAD_RESP" | tail -1)
      if [ "$HTTP_CODE" = "201" ]; then
        echo "  ${APK} uploaded successfully."
      else
        echo "  WARN: ${APK} upload returned HTTP ${HTTP_CODE}"
        echo "$UPLOAD_RESP" | sed '$d' | jq . 2>/dev/null || true
      fi
      done

      # Upload AAB as release asset
      echo "Uploading ${AAB_NAME} ($(du -h ${AAB_NAME} | cut -f1))..."
      UPLOAD_RESP=$(curl -s -w "\n%{http_code}" \
        --max-time 300 \
        -X POST \
        -H "Authorization: token ${GHCR_TOKEN}" \
        -H "Content-Type: application/octet-stream" \
        "${UPLOAD_URL}?name=${AAB_NAME}" \
        --data-binary "@${AAB_NAME}")

      HTTP_CODE=$(echo "$UPLOAD_RESP" | tail -1)
      if [ "$HTTP_CODE" = "201" ]; then
        echo "  AAB uploaded successfully."
      else
        echo "  WARN: AAB upload returned HTTP ${HTTP_CODE}"
        echo "$UPLOAD_RESP" | sed '$d' | jq . 2>/dev/null || true
      fi

      echo "============================================================"
      echo "  GitHub Release: https://github.com/${GITHUB_REPO}/releases/tag/${CI_COMMIT_TAG}"
      echo "============================================================"
  allow_failure: true

# =============================================================================
# SDD CI gate (Tier 4B) — appended 2026-05-18
# Validates spec/, STRIDE, observability, dispatch, outcomes against the
# canonical validator at claude-gateway:scripts/validate-project-spec.py.
# See claude-gateway:scripts/sdd-ci-snippet.yml for the canonical version.
# =============================================================================
sdd_validate_spec:
  stage: validate
  image: python:3.12-slim
  before_script:
    - apt-get update -qq && apt-get install -qq -y --no-install-recommends git curl
    - pip install --quiet pyyaml
    - mkdir -p /opt/sdd/scripts
    # Pinned to an immutable commit rather than a moving feature-branch ref on
    # another project (claude-gateway, project 30): a rename or delete there
    # would otherwise fail this job, and with it the validate stage. Fail open
    # when the validator cannot be fetched — being unable to validate is not
    # the same as validation failing. Real spec violations still block below.
    - |
      SDD_VALIDATOR_REF=df93a44304e8a1657b4ea19c02980b9a9d74b96e
      for f in validate-project-spec.py cgc-drift-check.py; do
        if ! curl -fsSL \
            --retry 3 --retry-delay 2 --max-time 30 \
            "https://gitlab.nuclearlighters.net/api/v4/projects/30/repository/files/scripts%2F${f}/raw?ref=${SDD_VALIDATOR_REF}" \
            -o "/opt/sdd/scripts/${f}"; then
          echo "WARNING: could not fetch ${f} at ${SDD_VALIDATOR_REF} — skipping SDD validation."
          exit 0
        fi
        chmod +x "/opt/sdd/scripts/${f}"
      done
    - |
      PARENT_SPEC_HOME=$(python3 -c "import json; pj=json.load(open(\"PROJECT.json\",encoding=\"utf-8\")); print(pj.get(\"parent_project\",{}).get(\"spec_home\",\"\") or \"\")" 2>/dev/null || echo "")
      if [ -n "$PARENT_SPEC_HOME" ] && [ ! -d "$PARENT_SPEC_HOME" ]; then
        echo "Cloning parent docs/ to $PARENT_SPEC_HOME for cross-parent checks..."
        mkdir -p "$(dirname "$PARENT_SPEC_HOME")"
        git clone --depth 1 https://gitlab.nuclearlighters.net/products/cubeos/docs.git "$PARENT_SPEC_HOME" 2>&1 | tail -3 || true
      fi
  script:
    - |
      if [ ! -x /opt/sdd/scripts/validate-project-spec.py ]; then
        echo "SDD validator unavailable — skipping (see fetch warning above)."
        exit 0
      fi
    - python3 /opt/sdd/scripts/validate-project-spec.py "$CI_PROJECT_DIR"
    - python3 /opt/sdd/scripts/cgc-drift-check.py "$CI_PROJECT_DIR" --max-age-days 90 || echo "CGC drift warnings (non-blocking)"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - PROJECT.json
        - constitution.md
        - spec/**/*
        - steering/**/*
        - adr/**/*
        - dispatch/**/*
        - outcomes/**/*
  allow_failure: false

# -----------------------------------------------------------------------------
# CHANGELOG — tell meshsat.net to regenerate /changelog/ when a tag is cut
# [MESHSAT-853]. Downstream: meshsat-website job changelog:regenerate (source
# "pipeline", CHANGELOG_RUN=1); it commits the new section and deploys only
# when the pages changed. The nightly schedule there covers everything else.
# -----------------------------------------------------------------------------
changelog:notify-website:
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  allow_failure: true
  variables:
    CHANGELOG_RUN: "1"
  trigger:
    project: products/meshsat/meshsat-website
    branch: main
